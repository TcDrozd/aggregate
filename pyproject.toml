[project]
name = "aggregate"
version = "0.1.0"
description = "Connector-based personal finance ledger"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Trevor Drozd" }]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.6",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
aggregate = "aggregate.cli:app"

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.format]
exclude = ["*.md"]  # code blocks in docs are illustrations, laid out by hand

[tool.ruff.lint]
select = [
  "E", "W", "F",  # pycodestyle, pyflakes
  "I",            # isort
  "B",            # bugbear
  "UP",           # pyupgrade
  "S",            # bandit
  "SIM",          # simplify
  "DTZ",          # no naive datetimes
  "PT",           # pytest style
  "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest works

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = ["private: real captures from tests/fixtures/private; local only, skipped in CI"]

[tool.coverage.run]
source = ["aggregate"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.170.14",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]
